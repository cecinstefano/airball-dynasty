<style>
  @import url('https://fonts.googleapis.com/css2?family=Ultra&family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --purple-deep: #2D0A4E;
    --purple-mid: #4B1A7A;
    --purple-light: #6B2FA0;
    --orange: #F97316;
    --orange-dark: #EA6A08;
    --black: #0A0A0A;
    --white: #FFFFFF;
    --gray-bg: #F1F1F5;
    --gray-card: #FAFAFA;
    --gray-border: #E2E2E8;
    --gray-text: #6B6B7B;
    --gray-dark: #1A1A2E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--gray-bg);
    color: var(--black);
    min-height: 100vh;
  }

  h1, h2, h3, h4, h5, .oswald { font-family: 'Oswald', sans-serif; }

  /* TOP BAR */
  .topbar {
    background: var(--black);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 38px;
    border-bottom: 1px solid #1f1f2e;
  }
  .topbar-links { display: flex; gap: 0; }
  .topbar-link {
    color: #aaa;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 0 14px;
    height: 38px;
    display: flex;
    align-items: center;
    cursor: pointer;
    border: none;
    background: none;
    transition: color 0.2s, background 0.2s;
    font-family: 'Oswald', sans-serif;
    border-right: 1px solid #222;
  }
  .topbar-link:first-child { border-left: 1px solid #222; }
  .topbar-link:hover, .topbar-link.active { color: var(--orange); background: #111; }
  .topbar-right { color: #555; font-size: 11px; display: flex; align-items: center; gap: 8px; }
  .topbar-season { color: var(--orange); font-weight: 700; font-family: 'Oswald', sans-serif; letter-spacing: 1px; }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--purple-deep) 0%, #1a0635 40%, var(--purple-deep) 100%);
    padding: 0 24px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    border-bottom: 2px solid var(--orange);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .menu-btn {
    display: flex; flex-direction: column; gap: 4px;
    cursor: pointer; padding: 6px; border: none; background: none;
  }
  .menu-btn span {
    display: block; width: 22px; height: 2px;
    background: white; border-radius: 2px; transition: 0.2s;
  }
  .menu-label { color: #aaa; font-size: 10px; letter-spacing: 2px; font-weight: 600; font-family: 'Oswald', sans-serif; }

  .logo-area { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--orange) 0%, var(--orange-dark) 50%, #c45a00 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 0 0 12px rgba(249,115,22,0.4);
    overflow: hidden;
  }
  .logo-img { width: 100%; height: 100%; object-fit: cover; }
  .logo-text { line-height: 1; }
  .logo-top { font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 400; color: #aaa; letter-spacing: 3px; text-transform: uppercase; }
  .logo-main { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--orange); letter-spacing: 1px; line-height: 1; }
  .logo-sub { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 500; color: #c084fc; letter-spacing: 4px; text-transform: uppercase; }

  .header-brand-text {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    white-space: nowrap;
    text-align: center;
    line-height: 0.92;
  }
  .brand-airball {
    display: block;
    font-family: 'Ultra', 'Rockwell Extra Bold', 'Georgia', serif;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #F97316;
    -webkit-text-fill-color: #F97316;
    -webkit-text-stroke: 0;
    paint-order: stroke fill;
    text-shadow:
      2px 0 0 #ffffff,
      -2px 0 0 #ffffff,
      0 2px 0 #ffffff,
      0 -2px 0 #ffffff,
      2px 2px 0 #ffffff,
      -2px 2px 0 #ffffff,
      2px -2px 0 #ffffff,
      -2px -2px 0 #ffffff,
      4px 5px 0 rgba(0,0,0,0.72),
      0 0 18px rgba(249,115,22,0.55);
  }
  .brand-dynasty {
    display: block;
    margin-top: 6px;
    font-family: 'Ultra', 'Rockwell Extra Bold', 'Georgia', serif;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #7C3AED;
    -webkit-text-fill-color: #7C3AED;
    -webkit-text-stroke: 0;
    paint-order: stroke fill;
    text-shadow:
      1.5px 0 0 #ffffff,
      -1.5px 0 0 #ffffff,
      0 1.5px 0 #ffffff,
      0 -1.5px 0 #ffffff,
      1.5px 1.5px 0 #ffffff,
      -1.5px 1.5px 0 #ffffff,
      1.5px -1.5px 0 #ffffff,
      -1.5px -1.5px 0 #ffffff,
      3px 4px 0 rgba(0,0,0,0.75),
      0 0 14px rgba(124,58,237,0.6);
  }

  .header-right { display: none; }
  .champion-pennant {
    position: absolute;
    right: 24px;
    top: -4px;
    width: 78px;
    height: 108px;
    z-index: 6;
    pointer-events: none;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.24));
  }
  .champion-pennant-rod {
    position: absolute;
    top: 0;
    left: 5px;
    right: 5px;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(180deg, #f6dc74 0%, #d4a72c 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.45) inset;
  }
  .champion-pennant-rod::before,
  .champion-pennant-rod::after {
    content: '';
    position: absolute;
    top: -1px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: linear-gradient(180deg, #f9df7a 0%, #c89215 100%);
  }
  .champion-pennant-rod::before { left: -1px; }
  .champion-pennant-rod::after { right: -1px; }
  .champion-pennant-body {
    position: absolute;
    top: 4px;
    left: 6px;
    right: 6px;
    bottom: 0;
    background: linear-gradient(180deg, #f2cc55 0%, #dba11a 100%);
    clip-path: polygon(0 0, 100% 0, 100% 76%, 50% 100%, 0 76%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .champion-pennant-body::before {
    content: '';
    position: absolute;
    inset: 2px;
    background: radial-gradient(circle at 50% 18%, rgba(255,255,255,0.14), transparent 28%), linear-gradient(180deg, #0d6b35 0%, #014f29 58%, #08381f 100%);
    clip-path: polygon(0 0, 100% 0, 100% 76%, 50% 100%, 0 76%);
    box-shadow: inset 0 0 0 1px rgba(255,242,184,0.28), inset 0 -10px 18px rgba(0,0,0,0.18);
  }
  .champion-pennant-content {
    position: relative;
    z-index: 1;
    padding: 9px 5px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .champion-pennant-kicker {
    font-family: 'Oswald', sans-serif;
    font-size: 6px;
    line-height: 1;
    letter-spacing: 1px;
    color: #fff2b8;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .champion-pennant-team {
    font-family: 'Oswald', sans-serif;
    font-size: 9px;
    line-height: 0.94;
    font-weight: 700;
    color: #ffd84c;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .champion-pennant-mark {
    margin: 4px 0 4px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.42);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.18);
    overflow: hidden;
  }
  .champion-pennant-mark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .champion-pennant-champ {
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    line-height: 0.95;
    font-weight: 700;
    color: #ffd84c;
    text-transform: uppercase;
    letter-spacing: 0.2px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .champion-pennant-trophy {
    margin-top: 1px;
    font-size: 12px;
    line-height: 1;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }
  .search-box {
    display: flex; align-items: center;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; padding: 8px 14px; gap: 8px;
    transition: border 0.2s;
  }
  .search-box:focus-within { border-color: var(--orange); }
  .search-box input {
    background: none; border: none; outline: none;
    color: white; font-size: 13px; width: 220px;
  }
  .search-box input::placeholder { color: rgba(255,255,255,0.35); }
  .user-area { display: flex; align-items: center; gap: 8px; }
  .user-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--purple-light), var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: white; font-family: 'Oswald', sans-serif;
    border: 2px solid var(--orange);
  }
  .user-name { color: white; font-size: 13px; font-weight: 500; }
  .user-greeting { color: #aaa; font-size: 11px; }

  /* MATCHUPS STRIP */
  .matchups-strip {
    background: var(--gray-dark);
    padding: 0;
    border-bottom: 1px solid #2a2a3e;
    display: flex;
    align-items: stretch;
    overflow: hidden;
  }
  .matchups-marquee {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  .matchups-track {
    display: flex;
    gap: 0;
    width: max-content;
    animation: matchupMarquee 58s linear infinite;
    will-change: transform;
  }
  .matchups-track:hover { animation-play-state: paused; }
  @keyframes matchupMarquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .matchups-marquee::before, .matchups-marquee::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 36px;
    z-index: 3;
    pointer-events: none;
  }
  .matchups-marquee::before {
    left: 0;
    background: linear-gradient(to right, var(--gray-dark), rgba(26,26,46,0));
  }
  .matchups-marquee::after {
    right: 0;
    background: linear-gradient(to left, var(--gray-dark), rgba(26,26,46,0));
  }

  .week-card {
    min-width: 130px; padding: 14px 16px;
    border-right: 1px solid #2a2a3e;
    display: flex; flex-direction: column; justify-content: center; gap: 8px;
    flex-shrink: 0;
    position: relative;
    z-index: 4;
  }
  .week-label { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; color: var(--orange); }
  .week-btn {
    background: var(--orange); color: white; border: none;
    font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 1px; padding: 5px 10px; border-radius: 4px; cursor: pointer;
    transition: background 0.2s;
  }
  .week-btn:hover { background: var(--orange-dark); }

  .matchup-card {
    min-width: 360px; padding: 14px 20px;
    border-right: 1px solid #2a2a3e; cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
    display: flex; flex-direction: column; gap: 6px;
  }
  .matchup-card:hover { background: rgba(249,115,22,0.05); }

  .matchup-time {
    display: flex; align-items: center; justify-content: space-between;
  }
  .matchup-when { color: #888; font-size: 10px; font-weight: 600; letter-spacing: 1px; font-family: 'Oswald', sans-serif; }
  .badge-preview { background: #2a2a3e; color: #aaa; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px; letter-spacing: 1px; }
  .badge-live { background: #ef4444; color: white; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px; letter-spacing: 1px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  .matchup-teams {
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
  }
  .team-mini { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 96px; }
  .team-mini-icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: white; font-family: 'Oswald', sans-serif;
  }
  .team-mini-name { font-size: 10px; color: #cfd0dc; text-align: center; font-weight: 600; max-width: 96px; line-height: 1.15; }

  
  .matchup-team-logo-plain {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: transparent;
    overflow: visible;
  }
  .matchup-team-logo-plain-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.28));
  }
  .matchup-team-logo-plain-fallback {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--purple-mid), var(--orange));
    color: white;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .6px;
    box-shadow: 0 8px 14px rgba(0,0,0,0.22);
  }

  .vs-score { text-align: center; min-width: 74px; flex-shrink: 0; }
  .score-display { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: white; white-space: nowrap; letter-spacing: 0.5px; }
  .score-period { font-size: 10px; color: var(--orange); font-weight: 700; }

  /* MAIN CONTENT */
  .main-wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }

  .content-grid {
    display: grid; grid-template-columns: 1fr 320px;
    gap: 24px;
  }

  /* NEWS AREA */
  .news-grid {
    display: grid; grid-template-rows: auto 1fr;
    grid-template-columns: minmax(0, 1.28fr) minmax(0, 0.92fr);
    gap: 16px;
  }
  .featured-card {
    grid-row: 1 / 3; grid-column: 1 / 2;
    border-radius: 16px; overflow: hidden; position: relative;
    min-height: 450px; cursor: pointer;
    background: linear-gradient(135deg, var(--purple-deep) 0%, #0f0520 100%);
  }
  .featured-bg {
    position: absolute; inset: 0;
    background: 
      radial-gradient(ellipse at 70% 30%, rgba(249,115,22,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(107,47,160,0.3) 0%, transparent 50%),
      linear-gradient(135deg, #1a0635 0%, #0a0015 100%);
  }
  .court-lines {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.5) 40px, rgba(255,255,255,0.5) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(255,255,255,0.3) 80px, rgba(255,255,255,0.3) 81px);
  }
  .ball-deco {
    position: absolute; right: -40px; top: -40px;
    width: 220px; height: 220px; border-radius: 50%;
    border: 3px solid rgba(249,115,22,0.2);
    box-shadow: inset 0 0 60px rgba(249,115,22,0.1);
  }
  .ball-deco::after {
    content: ''; position: absolute; inset: 20px; border-radius: 50%;
    border: 2px solid rgba(249,115,22,0.15);
  }
  .featured-content {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 28px;
  }
  .featured-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--orange); color: white;
    font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 2px;
    padding: 4px 12px; border-radius: 4px; width: fit-content; margin-bottom: 12px;
  }
  .featured-title {
    font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700;
    color: white; line-height: 1.2; margin-bottom: 16px;
  }
  .featured-bullets { display: flex; flex-direction: column; gap: 6px; }
  .featured-bullet {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: rgba(255,255,255,0.75);
  }
  .featured-bullet::before {
    content: ''; width: 4px; height: 4px; border-radius: 50%;
    background: var(--orange); flex-shrink: 0;
  }
  .featured-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .featured-mvp { display: flex; align-items: center; gap: 8px; }
  .mvp-icon { font-size: 18px; }
  .mvp-label { color: rgba(255,255,255,0.5); font-size: 11px; }
  .mvp-name { color: var(--orange); font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; }
  .featured-time { color: rgba(255,255,255,0.4); font-size: 11px; }

  .side-news {
    border-radius: 12px; overflow: hidden; position: relative;
    min-height: 190px; cursor: pointer;
  }
  .side-news-bg {
    position: absolute; inset: 0;
  }
  .side-news-content {
    position: relative; z-index: 2; padding: 20px;
    height: 100%; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .news-cat {
    font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2px;
    padding: 3px 8px; border-radius: 3px; display: inline-block; width: fit-content; margin-bottom: 8px;
  }
  .cat-rules { background: #7c3aed; color: white; }
  .cat-market { background: #059669; color: white; }
  .cat-perf { background: #2563eb; color: white; }
  .cat-analysis { background: var(--orange); color: white; }
  .cat-interview { background: #dc2626; color: white; }
  .cat-draft { background: #d97706; color: white; }
  .cat-featured { background: var(--orange); color: white; }

  .side-news-title {
    font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700;
    color: white; line-height: 1.3; margin-bottom: 4px;
  }
  .side-news-desc { font-size: 11px; color: rgba(255,255,255,0.7); }

  /* SIDEBAR */
  .sidebar { display: flex; flex-direction: column; gap: 16px; }

  .sidebar-card {
    background: white; border-radius: 14px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .sidebar-card-header {
    background: linear-gradient(135deg, var(--purple-deep), var(--purple-mid));

  .video-thumb {

function getDraftPickInfoForOverall(overallPick) {
    const overall = Number(overallPick) || 1;
    const round = Math.floor((overall - 1) / 16) + 1;
    const pick = ((overall - 1) % 16) + 1;
    const seedPick = round % 2 === 1 ? pick : 17 - pick;
    const originalTeam = DRAFT_ORDER.find(row => Number(row.pick) === Number(seedPick)) || DRAFT_ORDER[0];
    const ownerName = DRAFT_PICK_OWNER_OVERRIDES[overall] || originalTeam.name;
    const ownerTeam = getTeam(ownerName);
    return {
        overall,
        overallPick: overall,
        round,
        pick,
        seedPick,
        originalTeam,
        ownerName,
        ownerTeam,
        team: ownerTeam
    };
}
function getDraftPicksForTeam(teamName, rounds = 8) {
    const normalized = normalizeTeamName(teamName);
    const maxOverall = Number(rounds || 8) * 16;
    const picks = [];
    for (let overall = 1; overall <= maxOverall; overall += 1) {
        const info = getDraftPickInfoForOverall(overall);
        if (normalizeTeamName(info.ownerName) === normalized) {
            picks.push(info);
        }
    }
    return picks;
}

function getPlayerProjectionTokens(name) {
    return String(name || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .trim()
        .split(/\s+/)
        .filter(Boolean);
}

function makePlayerProjectionKey(name) {
    const tokens = getPlayerProjectionTokens(name);
    if (!tokens.length)
        return '';
    const suffixes = [];
    const core = [...tokens];
    while (core.length > 1 && ['jr', 'sr', 'ii', 'iii', 'iv', 'v'].includes(core[core.length - 1]))
        suffixes.unshift(core.pop());
    if (core.length >= 3 && core[0].length === 1 && core[1].length === 1)
        return [core[0], ...core.slice(2), ...suffixes].join(' ');
    if (core[0].length === 1)
        return [core[0], ...core.slice(1), ...suffixes].join(' ');
    return [core[0].charAt(0), ...core.slice(1), ...suffixes].join(' ');
}

function getPlayerProjectionKeyCandidates(name) {
    const tokens = getPlayerProjectionTokens(name);
    const primary = makePlayerProjectionKey(name);
    if (!tokens.length)
        return [];
    const suffixes = [];
    const core = [...tokens];
    while (core.length > 1 && ['jr', 'sr', 'ii', 'iii', 'iv', 'v'].includes(core[core.length - 1]))
        suffixes.unshift(core.pop());
    const firstInitial = core[0] ? core[0].charAt(0) : '';
    const candidates = [primary];
    if (firstInitial && core.length >= 2)
        candidates.push([firstInitial, core[core.length - 1], ...suffixes].join(' '));
    if (firstInitial && core.length >= 3)
        candidates.push([firstInitial, ...core.slice(-2), ...suffixes].join(' '));
    return [...new Set(candidates.filter(Boolean))];
}

        TRADE_PICKS_ARTICLE: 'Primeira troca com picks da AirBall | AirBall'
    };
    const descriptions = {
        HOME: 'Site oficial da AirBall Dynasty League: notícias, draft, franquias, calendário, trades, rankings e simulador da temporada 2026/27.',
        JOGADORES: 'Board de jogadores da AirBall com filtros por posição, franquia, keeper, média fantasy e projeções.',
        DRAFT: 'Ordem, board, contagem regressiva e informações do Draft AirBall Dynasty League 2026/27.',
        'LIVE DRAFT': 'Central do slow draft da AirBall com time no relógio, contador, melhores disponíveis, escolhas realizadas e ranking atualizado por AVG.',
        'SIMULADOR DE DRAFT': 'Simule as escolhas do draft da AirBall respeitando ordem snake, picks trocadas e keepers oficiais.',
        TIMES: teamName ? `Dossiê completo da franquia ${teamName}: GM, keepers, draft projetado, calendário, trades, jogos esperados e análise da I.A.` : 'Central das franquias da AirBall com logos, GMs, keepers, draft projetado, calendário, trades e análise da I.A.',
        REGRAS: 'Regulamento oficial da AirBall Dynasty League, sistema de pontuação, rosters, waivers, playoffs e punições.',
        'HONESTÔMETRO': 'Ferramenta da AirBall para analisar equilíbrio de trades com jogadores, picks e multiplicadores de AVG.',
        'CALENDÁRIO': 'Calendário oficial da temporada regular 2026/27 da AirBall Dynasty League, com 18 semanas de confrontos.',
        'HALL DA FAMA': 'Hall da Fama da AirBall Dynasty League com campeões, campanhas históricas, MVPs e recordes.',
        TRADES: 'Trade Center da AirBall Dynasty League com movimentações oficiais, jogadores envolvidos, AVGs e análises.',
        'SORTEIO DRAFT': 'Página do sorteio do Draft AirBall Dynasty League 2026/27.',
        KEEPERS_ARTICLE: 'Análise da I.A. sobre os keepers da temporada 2026/27 da AirBall Dynasty League.',
        DRAFT_IDEAL_ARTICLE: 'Simulação do draft ideal da AirBall somada aos keepers projetados, com ranking completo das franquias.',
        TRADE_PICKS_ARTICLE: 'Análise da primeira troca com picks da história da AirBall: Giannis, Chet e movimentação no draft.'
    };
    return {
        title: titles[page] || titles.HOME,
        description: descriptions[page] || descriptions.HOME,
        url: getRouteUrl(page, teamSlug),
        image: AIRBALL_SHARE_IMAGE
    };
}
function updateSeoMeta(page, teamSlug = '') {
    if (typeof document === 'undefined')
        return;
    const seo = getSeoForPage(page, teamSlug);
    document.title = seo.title;
    setMetaTag('name', 'description', seo.description);
    setMetaTag('property', 'og:title', seo.title);
    setMetaTag('property', 'og:description', seo.description);
    setMetaTag('property', 'og:url', seo.url);
    setMetaTag('property', 'og:image', seo.image);
    setMetaTag('property', 'og:image:secure_url', seo.image);
    setMetaTag('property', 'og:image:type', 'image/jpeg');
    setMetaTag('property', 'og:image:width', '1200');
    setMetaTag('property', 'og:image:height', '630');
    setMetaTag('property', 'og:image:alt', 'AirBall Dynasty League');
    setMetaTag('name', 'twitter:title', seo.title);
    setMetaTag('name', 'twitter:description', seo.description);
    setMetaTag('name', 'twitter:image', seo.image);
    updateCanonical(seo.url);
}

// ==================== APP ====================
function App() {
    const [routeState, setRouteState] = useState(() => parseHashRoute());
    const page = routeState.page || 'HOME';
    const teamSlug = routeState.teamSlug || '';

    useEffect(() => {
        if (!window.location.hash)
            updateBrowserHash(page, teamSlug, true);
        updateSeoMeta(page, teamSlug);
        const syncFromUrl = () => {
            setRouteState(parseHashRoute());
        };
        window.addEventListener('popstate', syncFromUrl);
        window.addEventListener('hashchange', syncFromUrl);
        return () => {
            window.removeEventListener('popstate', syncFromUrl);
            window.removeEventListener('hashchange', syncFromUrl);
        };
    }, []);

    useEffect(() => {
        updateSeoMeta(page, teamSlug);
    }, [page, teamSlug]);

    const navigateTo = (nextPage, options = {}) => {
        const nextState = {
            page: nextPage || 'HOME',
            teamSlug: options.teamSlug || ''
        };
        setRouteState(nextState);
        updateBrowserHash(nextState.page, nextState.teamSlug);
        updateSeoMeta(nextState.page, nextState.teamSlug);
    };

    const setPage = (nextPage) => navigateTo(nextPage);

    const setTeamRoute = (nextTeamSlug = '') => {
        const nextState = { page: 'TIMES', teamSlug: nextTeamSlug || '' };
        setRouteState(nextState);
        updateBrowserHash(nextState.page, nextState.teamSlug);
        updateSeoMeta(nextState.page, nextState.teamSlug);
    };

    const renderPage = () => {
        switch (page) {
            case 'TIMES': return React.createElement(TeamsPage, { initialTeamSlug: teamSlug, onTeamRouteChange: setTeamRoute });
            case 'REGRAS': return React.createElement(RulesPage, null);
            case 'HONESTÔMETRO': return React.createElement(HonestometroPage, null);
            case 'CALENDÁRIO': return React.createElement(CalendarPage, null);
            case 'HALL DA FAMA': return React.createElement(HallOfFamePage, null);
            case 'TRADES': return React.createElement(TradesPage, null);
            case 'DRAFT': return React.createElement(DraftPage, null);
            case 'LIVE DRAFT': return React.createElement(LiveDraftPage, null);
            case 'SIMULADOR DE DRAFT': return React.createElement(DraftSimulatorPage, null);
            case 'SORTEIO DRAFT': return React.createElement(DraftDrawPage, null);
            case 'JOGADORES': return React.createElement(PlayersPage, null);
            case 'KEEPERS_ARTICLE': return React.createElement(KeeperArticlePage, { setPage: setPage });
            case 'DRAFT_IDEAL_ARTICLE': return React.createElement(DraftIdealArticlePage, { setPage: setPage });
            case 'TRADE_PICKS_ARTICLE': return React.createElement(TradePicksArticlePage, { setPage: setPage });
            default: return React.createElement(HomePage, { setPage: setPage });
        }
    };
    return (React.createElement("div", null,
        React.createElement(TopBar, { activePage: page, setPage: setPage }),
        React.createElement(Header, null),
        renderPage(),
        React.createElement("footer", { className: "footer" },
            React.createElement("strong", null, "AIRBALL DYNASTY LEAGUE"),
            " • Since FEV 2025 • Temporada 2026/27 • Todos os direitos reservados")));
}

ReactDOM.render(React.createElement(App, null), document.getElementById('root'));

</script>
